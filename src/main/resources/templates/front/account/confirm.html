<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>アカウント登録（確認） - フルネス文具</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/front.css}">
</head>
<body>
<div th:replace="~{front/fragments/layout :: header}"></div>

<main class="container">
    <div class="mx-auto" style="max-width: 560px;">
        <h1 class="text-center mb-4">アカウント登録（確認）</h1>

        <table class="table table-borderless w-auto mx-auto text-center">
            <tbody>
            <tr><th>氏名</th><td th:text="${form.name}"></td></tr>
            <tr><th>氏名カナ</th><td th:text="${form.nameKana}"></td></tr>
            <tr><th>住所1</th><td th:text="${form.address1}"></td></tr>
            <tr><th>住所2</th><td th:text="${form.address2}"></td></tr>
            <tr><th>電話番号</th><td th:text="${form.phone}"></td></tr>
            <tr><th>メールアドレス</th><td th:text="${form.mail}"></td></tr>
            <tr><th>アカウント名</th><td th:text="${form.accountName}"></td></tr>
            <tr><th>パスワード</th><td>*********</td></tr>
            </tbody>
        </table>

        <form th:action="@{/account/confirm}" method="post" class="text-center">
            <button type="submit" name="action" value="back" class="btn btn-fs px-4">戻る</button>
            <button type="submit" name="action" value="register" class="btn btn-fs-solid px-4">登録</button>
        </form>
    </div>
</main>

<div th:replace="~{front/fragments/layout :: footer}"></div>
</body>
</html>
