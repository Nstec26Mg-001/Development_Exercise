<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>アカウント登録 - フルネス文具</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/front.css}">
</head>
<body>
<div th:replace="~{front/fragments/layout :: header}"></div>

<main class="container">
    <div class="mx-auto" style="max-width: 720px;">
        <h1 class="text-center mb-4">アカウント登録</h1>

        <ul class="alert alert-danger" th:if="${errorMessages}">
            <li th:each="msg : ${errorMessages}" th:text="${msg}"></li>
        </ul>

        <form th:action="@{/account/form}" method="post">
            <div class="row g-3">
                <div class="col-md-6 d-flex align-items-center gap-2">
                    <label class="form-label mb-0 flex-shrink-0 text-end" style="width: 6.5em;">氏名</label>
                    <input type="text" name="name" class="form-control" th:value="${form.name}" maxlength="20">
                </div>
                <div class="col-md-6 d-flex align-items-center gap-2">
                    <label class="form-label mb-0 flex-shrink-0 text-end" style="width: 6.5em;">氏名カナ</label>
                    <input type="text" name="nameKana" class="form-control" th:value="${form.nameKana}" maxlength="20">
                </div>
                <div class="col-md-6 d-flex align-items-center gap-2">
                    <label class="form-label mb-0 flex-shrink-0 text-end" style="width: 6.5em;">住所1</label>
                    <input type="text" name="address1" class="form-control" th:value="${form.address1}" maxlength="100">
                </div>
                <div class="col-md-6 d-flex align-items-center gap-2">
                    <label class="form-label mb-0 flex-shrink-0 text-end" style="width: 6.5em;">住所2</label>
                    <input type="text" name="address2" class="form-control" th:value="${form.address2}" maxlength="100">
                </div>
                <div class="col-md-6 d-flex align-items-center gap-2">
                    <label class="form-label mb-0 flex-shrink-0 text-end" style="width: 6.5em;">電話番号</label>
                    <input type="text" name="phone" class="form-control" th:value="${form.phone}" placeholder="090-1234-5678" maxlength="13">
                </div>
                <div class="col-md-6 d-flex align-items-center gap-2">
                    <label class="form-label mb-0 flex-shrink-0 text-end" style="width: 6.5em;">メールアドレス</label>
                    <input type="text" name="mail" class="form-control" th:value="${form.mail}" maxlength="100">
                </div>
                <div class="col-md-6 d-flex align-items-center gap-2">
                    <label class="form-label mb-0 flex-shrink-0 text-end" style="width: 6.5em;">アカウント名</label>
                    <input type="text" name="accountName" class="form-control" th:value="${form.accountName}" placeholder="半角英数字5〜20文字" maxlength="20">
                </div>
                <div class="col-md-6 d-flex align-items-center gap-2">
                    <label class="form-label mb-0 flex-shrink-0 text-end" style="width: 6.5em;">パスワード</label>
                    <input type="password" name="password" class="form-control" placeholder="半角英数字5〜20文字" maxlength="20">
                </div>
            </div>
            <div class="text-center mt-4">
                <a th:href="@{/}" class="btn btn-fs px-4">キャンセル</a>
                <button type="submit" class="btn btn-fs-solid px-4">送信</button>
            </div>
        </form>
    </div>
</main>

<div th:replace="~{front/fragments/layout :: footer}"></div>
</body>
</html>
