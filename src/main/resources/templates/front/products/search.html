<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>カテゴリ別商品検索 - フルネス文具</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/front.css}">
</head>
<body>
<div th:replace="~{front/fragments/layout :: header}"></div>

<main class="container">
    <h1 class="text-center mb-4">カテゴリ別商品検索画面</h1>

    <form th:action="@{/products/search}" method="get" class="d-flex justify-content-center gap-2 mb-4">
        <select name="categoryId" class="form-select w-auto">
            <option value="">全商品</option>
            <option th:each="cat : ${categories}"
                    th:value="${cat.id}"
                    th:text="${cat.name}"
                    th:selected="${selectedCategoryId != null and selectedCategoryId == cat.id}"></option>
        </select>
        <button type="submit" class="btn btn-fs-solid">検索</button>
    </form>

    <div class="alert alert-info text-center" th:if="${#lists.isEmpty(products)}">
        該当する商品が見つかりませんでした
    </div>

    <div class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-3" th:unless="${#lists.isEmpty(products)}">
        <div class="col" th:each="p : ${products}">
            <div class="card product-card">
                <img th:src="@{${p.imagePath}}" th:alt="${p.name}" class="card-img-top p-2">
                <div class="card-body text-center">
                    <p class="card-text mb-1" th:text="${p.name}"></p>
                    <p class="price mb-2" th:text="${p.price} + '円'"></p>
                    <a th:href="@{/products/detail/{id}(id=${p.id})}" class="btn btn-fs-solid btn-sm">詳細</a>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{front/fragments/layout :: footer}"></div>
</body>
</html>
