<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>エラー - フルネス文具</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/front.css}">
</head>
<body>
<div th:replace="~{front/fragments/layout :: header}"></div>

<main class="container">
    <div class="mx-auto" style="max-width: 640px;">
        <h1 class="text-center mb-4">システムエラー</h1>
        <div class="alert alert-danger" th:text="${errorMessage}"></div>
        <p th:if="${errorDetail}" class="text-muted small" th:text="${errorDetail}"></p>
        <div class="text-center mt-3">
            <a th:href="@{/}" class="link-fs">&raquo; トップに戻る</a>
        </div>
    </div>
</main>

<div th:replace="~{front/fragments/layout :: footer}"></div>
</body>
</html>
