<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>購入（入力） - フルネス文具</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/front.css}">
</head>
<body>
<div th:replace="~{front/fragments/layout :: header}"></div>

<main class="container">
    <h1 class="text-center mb-4">購入（入力）</h1>
    <div class="text-end mb-3">
        <a th:href="@{/products/search}" class="btn btn-fs">買い物を続ける</a>
    </div>

    <div class="alert alert-info text-center" th:if="${#lists.isEmpty(cart)}">
        カートに商品がありません
    </div>

    <table class="table align-middle" th:unless="${#lists.isEmpty(cart)}">
        <thead>
        <tr>
            <th>商品名</th>
            <th>価格</th>
            <th>個数</th>
            <th>小計</th>
            <th>削除</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${cart}">
            <td th:text="${item.productName}"></td>
            <td th:text="${item.price} + '円'"></td>
            <td>
                <form th:action="@{/purchase/input/update}" method="post" class="d-inline">
                    <input type="hidden" name="productId" th:value="${item.productId}">
                    <select name="quantity" class="form-select form-select-sm d-inline-block w-auto" onchange="this.form.submit()">
                        <option th:each="i : ${#numbers.sequence(1, stockMap.get(item.productId))}"
                                th:value="${i}" th:text="${i}" th:selected="${i == item.quantity}"></option>
                    </select>
                </form>
            </td>
            <td th:text="${item.subtotal} + '円'"></td>
            <td>
                <form th:action="@{/purchase/input/remove}" method="post">
                    <input type="hidden" name="productId" th:value="${item.productId}">
                    <button type="submit" class="btn btn-outline-danger btn-sm">削除</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <div class="text-center" th:unless="${#lists.isEmpty(cart)}">
        <p class="fs-5">合計：<strong th:text="${totalAmount} + '円'"></strong></p>
        <a th:href="@{/purchase/confirm}" class="btn btn-fs-solid px-4">購入確認へ</a>
    </div>
</main>

<div th:replace="~{front/fragments/layout :: footer}"></div>
</body>
</html>
