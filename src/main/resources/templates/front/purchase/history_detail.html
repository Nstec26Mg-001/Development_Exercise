<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>購入履歴詳細 - フルネス文具</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/front.css}">
</head>
<body>
<div th:replace="~{front/fragments/layout :: header}"></div>

<main class="container">
    <h1 class="text-center mb-4">購入履歴詳細</h1>

    <table class="table table-bordered">
        <thead><tr><th>注文ID</th><th>注文日時</th><th>合計金額</th></tr></thead>
        <tbody>
        <tr>
            <td th:text="${order.id}"></td>
            <td th:text="${#temporals.format(order.orderDateTime, 'yyyy年MM月dd日 HH時mm分')}"></td>
            <td th:text="${order.totalAmount} + '円'"></td>
        </tr>
        </tbody>
    </table>

    <h2 class="h5 text-center mt-4">注文明細</h2>
    <table class="table table-bordered">
        <thead><tr><th>商品名</th><th>価格</th><th>個数</th></tr></thead>
        <tbody>
        <tr th:each="item : ${order.items}">
            <td th:text="${item.productName}"></td>
            <td th:text="${item.price} + '円'"></td>
            <td th:text="${item.quantity}"></td>
        </tr>
        </tbody>
    </table>

    <div class="text-center mt-4">
        <a th:href="@{/purchase/history}" class="btn btn-fs-solid px-4">戻る</a>
    </div>
</main>

<div th:replace="~{front/fragments/layout :: footer}"></div>
</body>
</html>
