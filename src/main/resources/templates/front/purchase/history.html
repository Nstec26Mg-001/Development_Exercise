<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>購入履歴一覧 - フルネス文具</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/front.css}">
</head>
<body>
<div th:replace="~{front/fragments/layout :: header}"></div>

<main class="container">
    <h1 class="text-center mb-4">購入履歴一覧</h1>

    <div class="alert alert-info text-center" th:if="${#lists.isEmpty(orders)}">
        購入履歴がありません
    </div>

    <table class="table table-bordered align-middle" th:unless="${#lists.isEmpty(orders)}">
        <thead>
        <tr>
            <th>注文ID</th>
            <th>注文日時</th>
            <th>合計金額</th>
            <th>詳細</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="o : ${orders}">
            <td th:text="${o.id}"></td>
            <td th:text="${#temporals.format(o.orderDateTime, 'yyyy年MM月dd日 HH時mm分')}"></td>
            <td th:text="${o.totalAmount} + '円'"></td>
            <td><a th:href="@{/purchase/history/{id}(id=${o.id})}" class="btn btn-fs-solid btn-sm">詳細</a></td>
        </tr>
        </tbody>
    </table>
</main>

<div th:replace="~{front/fragments/layout :: footer}"></div>
</body>
</html>
