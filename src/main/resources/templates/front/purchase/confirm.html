<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>購入確認 - フルネス文具</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/front.css}">
</head>
<body>
<div th:replace="~{front/fragments/layout :: header}"></div>

<main class="container">
    <h1 class="text-center mb-4">購入確認</h1>
    <div class="text-end mb-3">
        <a th:href="@{/products/search}" class="btn btn-fs">買い物を続ける</a>
    </div>

    <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <table class="table">
        <thead><tr><th>商品名</th><th>価格</th><th>個数</th></tr></thead>
        <tbody>
        <tr th:each="item : ${cart}">
            <td th:text="${item.productName}"></td>
            <td th:text="${item.price}"></td>
            <td th:text="${item.quantity}"></td>
        </tr>
        </tbody>
    </table>

    <p class="text-center fs-5">合計：<strong th:text="${totalAmount} + '円'"></strong></p>

    <form th:action="@{/purchase/confirm}" method="post" class="mx-auto" style="max-width: 360px;">
        <div class="mb-3">
            <label class="form-label">支払い方法</label>
            <select name="paymentMethod" class="form-select">
                <option value="cash">現金</option>
            </select>
        </div>
        <div class="d-flex justify-content-center gap-2">
            <button type="submit" name="action" value="back" class="btn btn-fs px-4">戻る</button>
            <button type="submit" name="action" value="purchase" class="btn btn-fs-solid px-4">購入確定</button>
        </div>
    </form>
</main>

<div th:replace="~{front/fragments/layout :: footer}"></div>
</body>
</html>
