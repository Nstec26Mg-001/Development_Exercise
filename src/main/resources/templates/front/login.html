<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ログイン - フルネス文具</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/front.css}">
</head>
<body>
<div th:replace="~{front/fragments/layout :: header}"></div>

<main class="container">
    <div class="mx-auto" style="max-width: 480px;">
        <h1 class="text-center mb-4">ログイン</h1>

        <div class="alert alert-danger" th:if="${errorMessage}" th:text="${errorMessage}"></div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <input type="text" name="mail" class="form-control" placeholder="メールアドレス" th:value="${mail}">
            </div>
            <div class="mb-3">
                <input type="password" name="password" class="form-control" placeholder="パスワード">
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-fs-solid">ログイン</button>
            </div>
        </form>
        <p class="text-center mt-3">
            <a th:href="@{/account/form}" class="link-fs">アカウント登録</a>
        </p>
    </div>
</main>

<div th:replace="~{front/fragments/layout :: footer}"></div>
</body>
</html>
