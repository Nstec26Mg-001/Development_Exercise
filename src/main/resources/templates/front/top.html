<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>フルネス文具 - トップ</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/front.css}">
</head>
<body>
<div th:replace="~{front/fragments/layout :: header}"></div>

<main class="container">
    <div id="catchCarousel" class="carousel slide mb-4" data-bs-ride="carousel">
        <div class="carousel-inner rounded">
            <div class="carousel-item active">
                <img th:src="@{/images/Shop_Img1.jpeg}" class="d-block w-100" alt="フルネス文具" style="max-height: 360px; object-fit: cover;">
            </div>
            <div class="carousel-item">
                <img th:src="@{/images/Shop_Img2.jpeg}" class="d-block w-100" alt="フルネス文具" style="max-height: 360px; object-fit: cover;">
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#catchCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#catchCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>
    </div>

    <div class="alert alert-info text-center" th:if="${#lists.isEmpty(products)}">
        商品が登録されていません
    </div>

    <div class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-3" th:unless="${#lists.isEmpty(products)}">
        <div class="col" th:each="p : ${products}">
            <a th:href="@{/products/detail/{id}(id=${p.id})}" class="text-decoration-none text-dark">
                <div class="card product-card">
                    <img th:src="@{${p.imagePath}}" th:alt="${p.name}" class="card-img-top p-2">
                    <div class="card-body text-start">
                        <p class="card-text mb-1" th:text="${p.name}"></p>
                        <p class="price mb-0" th:text="${p.price} + '円'"></p>
                    </div>
                </div>
            </a>
        </div>
    </div>
</main>

<div th:replace="~{front/fragments/layout :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
